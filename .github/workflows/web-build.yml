name: web-build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  UPSTREAM_REPO: CherryHQ/cherry-studio-app
  # Pinned upstream commit this overlay was built against (local clone HEAD).
  UPSTREAM_REF: a0cddfa51026675abe69b7a7b9ee37a529ac4e32
  NODE_VERSION: 24
  PNPM_VERSION: 12.2.1

jobs:
  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout overlay repo
        uses: actions/checkout@v4

      - name: Checkout upstream at pinned ref
        run: |
          git clone --filter=blob:none https://github.com/${{ env.UPSTREAM_REPO }}.git upstream
          cd upstream
          git checkout "${{ env.UPSTREAM_REF }}"
          echo "upstream HEAD: $(git rev-parse HEAD)"

      - name: Apply web overlay
        run: bash scripts/apply-overlay.sh

      - name: Show applied web config
        working-directory: upstream
        run: |
          node -e "console.log('expo.web =', JSON.stringify(require('./app.json').expo.web))"
          grep -c "web-shims" metro.config.js
          ls src/web-shims | wc -l

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable pnpm ${{ env.PNPM_VERSION }}
        run: |
          corepack enable
          corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate
          pnpm --version

      - name: Install dependencies
        working-directory: upstream
        env:
          CI: 1
        run: pnpm install --frozen-lockfile

      - name: Verify resolved web deps
        working-directory: upstream
        run: |
          node -e "console.log('react-native-web:', require('react-native-web/package.json').version)"
          node -e "console.log('react-dom:', require('react-dom/package.json').version)"
          node -e "console.log('expo:', require('expo/package.json').version)"
          # 0.21.4 ships dist/exports/InputAccessoryView/index.js; later 0.21.x dropped
          # it while dist/index.js still imports that path, which breaks the web bundle.
          test -e node_modules/react-native-web/dist/exports/InputAccessoryView/index.js \
            -o -e node_modules/react-native-web/dist/exports/InputAccessoryView.js \
            || { echo "::error::react-native-web lost dist/exports/InputAccessoryView; lockfile drifted from 0.21.4"; exit 1; }
          echo "--- InputAccessoryView entry ---"
          ls -la node_modules/react-native-web/dist/exports/ | grep -i accessory || true
          find node_modules/react-native-web/dist/exports/InputAccessoryView* -maxdepth 2 2>/dev/null || true
          echo "--- shims in overlay ---"
          ls src/web-shims | wc -l

      - name: Export web bundle
        working-directory: upstream
        env:
          PROFILE: production
          EXPO_NO_TELEMETRY: 1
        run: |
          set -o pipefail
          npx expo export --platform web --output-dir dist-web 2>&1 | tee "$GITHUB_WORKSPACE/export.log"

      - name: Surface export failure
        if: failure()
        run: |
          echo "::error::export failed - last log lines follow (annotations are public, full log needs sign-in)"
          if [ -f export.log ]; then
            tail -n 40 export.log | while IFS= read -r line; do
              line="${line//%/%25}"
              line="${line//$'\r'/}"
              echo "::error::${line}"
            done
          else
            echo "::error::export.log missing"
          fi

      - name: Publish export log on failure
        if: failure()
        run: |
          {
            echo "run: $GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo
            echo '```'
            if [ -f export.log ]; then tail -n 400 export.log; else echo "export.log missing"; fi
            echo '```'
          } > export-failure.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add export-failure.md
          git commit -m "ci: record export failure [skip ci]" || exit 0
          # checkout runs detached on push events, so name the branch explicitly
          git push origin HEAD:main || echo "::warning::could not push failure log"

      - name: Verify bundle output
        working-directory: upstream
        run: |
          test -d dist-web || { echo "::error::dist-web/ was not created"; exit 1; }
          echo "--- dist-web tree (top level) ---"
          ls -la dist-web
          size=$(du -sm dist-web | cut -f1)
          echo "bundle size: ${size} MB"
          html=$(find dist-web -maxdepth 1 -name '*.html' | wc -l)
          echo "html entry files: ${html}"
          test "$html" -ge 1 || { echo "::error::no html entry in dist-web"; exit 1; }
          if [ "$size" -lt 1 ]; then echo "::error::bundle suspiciously small"; exit 1; fi

      - name: Static smoke test bundle
        working-directory: upstream
        run: |
          python3 -m http.server 8099 --directory dist-web >/dev/null 2>&1 &
          SRV=$!
          sleep 2
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/)
          echo "index.html -> HTTP ${code}"
          test "$code" = "200" || { echo "::error::index.html not served"; kill $SRV; exit 1; }
          curl -s http://127.0.0.1:8099/ | grep -q "<script" \
            || { echo "::error::index.html has no <script> (bundle not linked)"; kill $SRV; exit 1; }
          js=$(curl -s http://127.0.0.1:8099/ | grep -oE 'src="[^"]+\.js"' | head -1 | sed 's/src="//;s/"//')
          echo "main bundle: ${js}"
          if [ -n "$js" ]; then
            bcode=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8099${js}")
            echo "bundle -> HTTP ${bcode}"
            test "$bcode" = "200" || { echo "::error::main bundle not fetchable"; kill $SRV; exit 1; }
          fi
          kill $SRV

      - name: Runtime smoke (headless Chromium)
        working-directory: upstream
        continue-on-error: true
        env:
          SMOKE_URL: http://127.0.0.1:8099/
          SMOKE_REPORT: ${{ github.workspace }}/runtime-smoke.md
        run: |
          python3 -m http.server 8099 --directory dist-web >/dev/null 2>&1 &
          SRV=$!
          sleep 2
          npx -y puppeteer-core@24 node ../scripts/runtime-smoke.mjs || true
          kill $SRV 2>/dev/null || true

      - name: Publish build report
        if: success()
        run: |
          {
            echo "# Web build report"
            echo
            echo "- run: $GITHUB_RUN_ID"
            echo "- commit: $GITHUB_SHA"
            echo "- upstream: CherryHQ/cherry-studio-app@a0cddfa + this overlay"
            echo
            echo "## dist-web top level"
            echo '```'
            ls -la upstream/dist-web
            echo '```'
            echo
            echo "## sizes"
            echo '```'
            du -sh upstream/dist-web
            du -sh upstream/dist-web/_expo 2>/dev/null || true
            find upstream/dist-web -type f | wc -l | xargs echo "files:"
            echo '```'
            echo
            echo "## asset count by extension"
            echo '```'
            find upstream/dist-web -type f | sed 's/.*\.//' | sort | uniq -c | sort -rn | head -20
            echo '```'
          } > build-report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-report.md
          [ -f runtime-smoke.md ] && git add runtime-smoke.md || true
          git commit -m "ci: web build report [skip ci]" || exit 0
          git push origin HEAD:main || echo "::warning::could not push build report"

      - name: Upload web bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: cherry-studio-web
          path: upstream/dist-web
          retention-days: 14
